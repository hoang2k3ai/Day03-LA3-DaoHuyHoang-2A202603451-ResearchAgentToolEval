# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user a concise question when essential information is missing
      or the request has multiple materially different interpretations.
      WHEN TO USE: Use when the target person, account, post, source, topic,
      platform, or required parameter cannot be reliably determined from
      conversation context.
      WHEN NOT TO USE: Do not use for optional preferences or details that
      can be safely inferred. Ask only for the minimum missing information.
      Never guess identities or invent URLs and identifiers.
    parameters:
      type: object
      properties:
        question:
          {
            type: string,
            default: "",
            description: "The single concise question to ask the user, in the user's language.",
          }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "text for open answers; yes_no for binary confirmations; choice when offering a fixed set of options (pass options).",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Only used with response_type=choice. 2-4 short, distinct choices.",
          }
      required: [question]

  - name: timeline
    description: >
      Retrieve recent posts from one specific social media account (X/Twitter),
      in chronological order.
      WHEN TO USE: Use when the user asks for recent posts, latest updates, or
      what a known account has been posting, and the account is identified.
      WHEN NOT TO USE: Do not use to discover posts across many accounts, for
      keyword/topic searches (use social_search), for web news (use lookup), or
      to read a specific post URL (use fetch). Never guess an account handle; if
      the handle is unknown, use clarify or lookup to resolve it first.
    parameters:
      type: object
      properties:
        screenname:
          {
            type: string,
            default: "",
            description: "The account's handle WITHOUT the @ prefix, e.g. 'OpenAI'. Must come from the user or a verified lookup result. Never guess.",
          }
        limit:
          {
            type: integer,
            default: 5,
            description: "Number of most recent posts to return. Default 5; keep small (up to about 20).",
          }
      required: [screenname]

  - name: social_search
    description: >
      Search social media posts (X/Twitter) by keyword or topic across all
      accounts, to find what people are posting or saying.
      WHEN TO USE: Use when the user wants posts, discussions, opinions, public
      reactions, or sentiment about a person, product, event, or topic, or wants
      to discover relevant social content.
      WHEN NOT TO USE: Do not use for recent posts from one known account (use
      timeline), for a single post or article at a known URL (use fetch), or for
      general web facts and news (use lookup).
      If the platform, keyword, or time range matters and is missing, ask via clarify.
    parameters:
      type: object
      properties:
        query:
          {
            type: string,
            default: "",
            description: "Search keywords or phrase. Include the full entity name (e.g. 'OpenAI GPT-5'). Do not add an @ prefix unless searching for that exact handle.",
          }
        search_type:
          {
            type: string,
            enum: [Latest, Top],
            default: "Latest",
            description: "Latest = newest posts first (default; use for 'recent' or 'what people are saying now'). Top = most-engaged posts first (use when the user asks for the most popular or most important posts).",
          }
        limit:
          {
            type: integer,
            default: 5,
            description: "Number of posts to return. Default 5.",
          }
      required: [query]

  - name: lookup
    description: >
      Search the open web for general information, facts, background, or news.
      WHEN TO USE: Use when the user asks for facts or background about a known
      person, organization, product, or entity; needs an entity name or identifier
      resolved before further searching; or asks for general or current web news
      (set topic=news).
      WHEN NOT TO USE: Do not use when the user gives a specific URL (use fetch),
      for social media posts (use social_search or timeline), for internal company
      rules (use policy), or for academic papers (use papers).
    parameters:
      type: object
      properties:
        query:
          {
            type: string,
            default: "",
            description: "Search query. Include the full entity name and key context (e.g. 'Anthropic Claude model release 2026'). Topic only: do NOT put time words ('hôm nay', 'tuần này') or news type ('tin tức') into query; pass those via timeframe and topic.",
          }
        topic:
          {
            type: string,
            enum: [general, news],
            default: "general",
            description: "news = current events and news articles. general = facts, background, and reference information (default).",
          }
        timeframe:
          {
            type: string,
            enum: [day, week, month, year],
            default: "week",
            description: "Time window for results. Use day for breaking news, week (default) for recent items, month or year for broader context. Pick the closest value to the period the user stated.",
          }
        max_results:
          {
            type: integer,
            default: 5,
            description: "Number of results to return. Default 5.",
          }
      required: [query]

  - name: fetch
    description: >
      Read the content of one specific web page or article at a known URL.
      WHEN TO USE: Use when the user provides a URL, asks to read, summarize, or
      extract information from a specific article or page, or a post's URL is known.
      WHEN NOT TO USE: Do not use to find pages or search the web (use lookup). Do
      not use when no URL is known. Never invent or guess a URL; if the URL is
      missing, use clarify.
    parameters:
      type: object
      properties:
        url:
          {
            type: string,
            default: "",
            description: "Full absolute URL including the scheme, e.g. https://example.com/article. Must come from the user or a previous tool result.",
          }
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template:
          {
            type: string,
            enum: [brief, sections, bullets, thread, daily_ai_vn],
            default: "sections",
            description: "Khuôn",
          }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                ai_research,
                source_citation,
                data_privacy,
                external_publishing,
                tool_usage,
              ],
            default: "all",
            description: "Nhóm",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by:
          {
            type: string,
            enum: [relevance, lastUpdatedDate, submittedDate],
            default: "relevance",
            description: "Sắp xếp",
          }
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]
